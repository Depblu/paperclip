<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-title" content="Paperclip" />
    <title>Paperclip</title>
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const key = "paperclip.theme";
        const darkThemeColor = "#18181b";
        const lightThemeColor = "#ffffff";
        try {
          const stored = window.localStorage.getItem(key);
          const theme = stored === "light" || stored === "dark" ? stored : "dark";
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <script>
      (() => {
        // Set <html lang> as early as possible to prevent screen readers
        // from announcing the wrong language before React mounts. Mirrors
        // the detection order in ui/src/i18n/index.ts so the values stay
        // in sync. Keep the supported-locale allowlist aligned with
        // ui/src/i18n/locales.ts.
        const key = "paperclip.locale";
        const migrationKey = "paperclip.locale.default.zh-CN.v1";
        const supported = [
          "ar","bn","cs","da","de","el","en","es","fa","fi","fil","fr","he","hi","hu","id","it","ja","ko","mr","ms","nb","nl","pa","pl","pt-BR","pt-PT","ro","ru","sv","sw","ta","te","th","tr","uk","ur","vi","zh-CN","zh-TW"
        ];
        const isSupported = (v) => v && supported.indexOf(v) !== -1;
        const base = (raw) => {
          if (!raw) return null;
          if (isSupported(raw)) return raw;
          const m = String(raw).split("-")[0];
          return isSupported(m) ? m : null;
        };
        let chosen = "zh-CN";
        try {
          const stored = window.localStorage.getItem(key);
          const migrated = window.localStorage.getItem(migrationKey);
          if (!migrated && (!stored || stored === "en")) {
            window.localStorage.setItem(key, "zh-CN");
            window.localStorage.setItem(migrationKey, "true");
            chosen = "zh-CN";
          } else if (isSupported(stored)) chosen = stored;
          else {
            const nav = base(window.navigator && window.navigator.language);
            if (nav) chosen = nav;
          }
          if (!migrated) window.localStorage.setItem(migrationKey, "true");
        } catch {}
        document.documentElement.lang = chosen;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
